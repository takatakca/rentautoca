name: Rentauto CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rentauto-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, changed-file lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Edge function source parity
        run: npm run qa:edge-sources

      - name: Lint changed TypeScript files
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.ts' '*.tsx' | grep -E '^(src|supabase)/' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi
          printf 'Linting changed files:\n%s\n' "${FILES[*]}"
          npx eslint "${FILES[@]}"

      - name: Protect shared TAKATAK schema from incompatible migrations
        run: node scripts/check-migration-safety.mjs

      - name: Test
        run: npm run test

      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-project
          VITE_APP_URL: https://rentauto.ca
        run: npm run build

      - name: Full repository lint debt report
        continue-on-error: true
        run: npm run lint

  outbox-sql-smoke:
    name: Staged Rentauto outbox SQL / RLS / lease smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentauto_outbox_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rentauto_outbox_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rentauto_outbox_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Run disposable SQL checks
        run: bash scripts/test-takatak-outbox-sql.sh

  direct-projection-sql-smoke:
    name: Existing TAKATAK direct trip projection SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentauto_projection_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rentauto_projection_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rentauto_projection_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Exercise installed direct projection SQL
        run: bash scripts/test-takatak-direct-projection-sql.sh
