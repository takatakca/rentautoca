name: Deploy rentauto.ca to MochaHost

on:
  workflow_run:
    workflows:
      - Rentauto CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rentauto-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build artifact and deploy rentauto.ca
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Browser-safe shared TAKATAK Supabase project. Server secrets remain in Supabase.
      VITE_TAKATAK_SUPABASE_URL: https://pcjfahhlozsseqqevimi.supabase.co
      VITE_TAKATAK_SUPABASE_PUBLISHABLE_KEY: sb_publishable_DKcKo_UMmp1cix9vVTr0fA_TFW4ryk0
      VITE_TAKATAK_SUPABASE_PROJECT_ID: pcjfahhlozsseqqevimi
      VITE_APP_URL: https://rentauto.ca

      MOCHAHOST_HOST: ${{ secrets.MOCHAHOST_HOST }}
      MOCHAHOST_USER: ${{ secrets.MOCHAHOST_USER }}
      MOCHAHOST_PORT: ${{ secrets.MOCHAHOST_PORT || '22' }}
      MOCHAHOST_APP_PATH: ${{ vars.MOCHAHOST_APP_PATH || '/home/bolonca/rentauto_node' }}

      PRODUCTION_URL: https://rentauto.ca

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate frontend configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in             VITE_TAKATAK_SUPABASE_URL             VITE_TAKATAK_SUPABASE_PUBLISHABLE_KEY             VITE_TAKATAK_SUPABASE_PROJECT_ID             VITE_APP_URL             DEPLOY_SHA
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required frontend value: $name"
              exit 1
            fi
          done

          echo "Validated revision: $DEPLOY_SHA"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production frontend
        run: npm run build

      - name: Verify and stamp production build
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html

          printf '%s\n' "$DEPLOY_SHA" > dist/revision.txt
          printf '%s\n' "$DEPLOY_SHA" > REVISION

          test "$(tr -d '\r\n' < dist/revision.txt)" = "$DEPLOY_SHA"

          echo "Production frontend stamped with $DEPLOY_SHA"

      - name: Create immutable production artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .deploy
          mkdir -p .deploy/release

          cp -a dist .deploy/release/dist
          cp REVISION .deploy/release/REVISION

          tar             -C .deploy/release             -czf ".deploy/rentauto-${DEPLOY_SHA}.tar.gz"             .

          test -s ".deploy/rentauto-${DEPLOY_SHA}.tar.gz"

          sha256sum ".deploy/rentauto-${DEPLOY_SHA}.tar.gz"             | tee ".deploy/rentauto-${DEPLOY_SHA}.sha256"

      - name: Preserve production artifact in GitHub
        uses: actions/upload-artifact@v4
        with:
          name: rentauto-production-${{ env.DEPLOY_SHA }}
          path: |
            .deploy/rentauto-${{ env.DEPLOY_SHA }}.tar.gz
            .deploy/rentauto-${{ env.DEPLOY_SHA }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Validate MochaHost deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in MOCHAHOST_HOST MOCHAHOST_USER MOCHAHOST_PORT MOCHAHOST_APP_PATH
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing MochaHost deployment value: $name"
              exit 1
            fi
          done

          echo "Deployment path: $MOCHAHOST_APP_PATH"
          echo "SSH port: $MOCHAHOST_PORT"

      - name: Configure SSH
        shell: bash
        env:
          MOCHAHOST_SSH_KEY: ${{ secrets.MOCHAHOST_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${MOCHAHOST_SSH_KEY:-}" ]; then
            echo "::error::Missing GitHub secret MOCHAHOST_SSH_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$MOCHAHOST_SSH_KEY"             | tr -d '\r'             > ~/.ssh/rentauto_deploy_key

          chmod 600 ~/.ssh/rentauto_deploy_key

          if ! ssh-keygen -y             -f ~/.ssh/rentauto_deploy_key             >/dev/null 2>&1; then
            echo "::error::MOCHAHOST_SSH_KEY is not a valid private SSH key."
            exit 1
          fi

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keyscan             -p "$MOCHAHOST_PORT"             -H "$MOCHAHOST_HOST"             >> ~/.ssh/known_hosts

      - name: Verify MochaHost remote command access
        shell: bash
        run: |
          set -euo pipefail

          ok=0
          for attempt in $(seq 1 5); do
            echo "SSH exec attempt $attempt/5..."

            if ssh -T                 -i ~/.ssh/rentauto_deploy_key                 -p "$MOCHAHOST_PORT"                 -o BatchMode=yes                 -o ConnectTimeout=15                 -o ServerAliveInterval=15                 -o ServerAliveCountMax=3                 "$MOCHAHOST_USER@$MOCHAHOST_HOST"                 "printf '%s\\n' 'RENTAUTO_REMOTE_EXEC_OK'"; then
              ok=1
              break
            fi

            sleep 5
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::MochaHost authenticated the SSH key but rejected remote command execution. The production artifact was preserved in GitHub; hosting access must allow SSH exec before activation can continue."
            exit 1
          fi

      - name: Upload artifact without SFTP dependency
        shell: bash
        run: |
          set -euo pipefail

          archive=".deploy/rentauto-${DEPLOY_SHA}.tar.gz"
          remote_dir="$MOCHAHOST_APP_PATH/incoming"
          remote_archive="$remote_dir/rentauto-${DEPLOY_SHA}.tar.gz"

          printf -v remote_dir_q '%q' "$remote_dir"
          printf -v remote_archive_q '%q' "$remote_archive"

          ssh -T             -i ~/.ssh/rentauto_deploy_key             -p "$MOCHAHOST_PORT"             -o BatchMode=yes             -o ConnectTimeout=15             -o ServerAliveInterval=15             -o ServerAliveCountMax=3             "$MOCHAHOST_USER@$MOCHAHOST_HOST"             "mkdir -p -- $remote_dir_q && cat > $remote_archive_q"             < "$archive"

          remote_size="$(ssh -T             -i ~/.ssh/rentauto_deploy_key             -p "$MOCHAHOST_PORT"             -o BatchMode=yes             "$MOCHAHOST_USER@$MOCHAHOST_HOST"             "wc -c < $remote_archive_q")"

          local_size="$(wc -c < "$archive")"

          if [ "$remote_size" != "$local_size" ]; then
            echo "::error::Remote artifact size mismatch."
            exit 1
          fi

      - name: Atomically activate app-root dist
        shell: bash
        run: |
          set -euo pipefail

          {
            printf 'set -euo pipefail\n'
            printf 'APP_PATH=%q\n' "$MOCHAHOST_APP_PATH"
            printf 'SHA=%q\n' "$DEPLOY_SHA"
            printf 'PRODUCTION_URL=%q\n' "$PRODUCTION_URL"

            cat <<'REMOTE'
          cd "$APP_PATH"

          ARCHIVE="incoming/rentauto-${SHA}.tar.gz"
          STAGE=".deploy-stage-${SHA}"
          ROLLBACK_ROOT=".deploy-rollbacks"

          test -f "$ARCHIVE"

          rm -rf "$STAGE"
          mkdir -p "$STAGE" "$ROLLBACK_ROOT"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          test -f "$STAGE/dist/index.html"
          test -f "$STAGE/dist/revision.txt"
          test "$(tr -d '\r\n' < "$STAGE/dist/revision.txt")" = "$SHA"

          OLD=""
          if [ -f REVISION ]; then
            OLD="$(tr -cd '0-9a-fA-F' < REVISION | head -c 40)"
          fi

          stamp="$(date +%Y%m%d%H%M%S)"
          backup_name="${OLD:-legacy-${stamp}}"
          BACKUP="$ROLLBACK_ROOT/$backup_name"

          if [ -e "$BACKUP" ]; then
            BACKUP="$ROLLBACK_ROOT/${backup_name}-${stamp}"
          fi

          if [ -d dist ]; then
            mv dist "$BACKUP"
          fi

          mv "$STAGE/dist" dist
          printf '%s\n' "$SHA" > REVISION.new
          mv REVISION.new REVISION

          rm -rf "$STAGE"

          deployment_ok=0

          for attempt in $(seq 1 24); do
            echo "Live verification attempt $attempt/24..."

            health_code="$(curl               --silent               --show-error               --output /tmp/rentauto-health-body               --write-out '%{http_code}'               --max-time 15               "$PRODUCTION_URL/healthz" || true)"

            root_code="$(curl               --silent               --show-error               --output /tmp/rentauto-root-body               --write-out '%{http_code}'               --max-time 15               "$PRODUCTION_URL/" || true)"

            live_revision="$(curl               --fail               --silent               --show-error               --max-time 15               "$PRODUCTION_URL/revision.txt" 2>/dev/null               | tr -d '\r\n' || true)"

            if [ "$health_code" = "200" ]               && [ "$root_code" = "200" ]               && [ "$live_revision" = "$SHA" ]; then
              deployment_ok=1
              break
            fi

            echo "health=${health_code:-000} root=${root_code:-000} revision=${live_revision:-missing}"
            sleep 5
          done

          if [ "$deployment_ok" -ne 1 ]; then
            echo "ERROR: New dist did not verify. Restoring previous dist."

            rm -rf "dist.failed-${SHA}"
            if [ -d dist ]; then
              mv dist "dist.failed-${SHA}"
            fi

            if [ -d "$BACKUP" ]; then
              mv "$BACKUP" dist
            fi

            if [ -n "$OLD" ]; then
              printf '%s\n' "$OLD" > REVISION.new
              mv REVISION.new REVISION
            else
              rm -f REVISION
            fi

            rollback_code="$(curl               --silent               --show-error               --output /tmp/rentauto-rollback-body               --write-out '%{http_code}'               --max-time 20               "$PRODUCTION_URL/healthz" || true)"

            echo "Rollback health HTTP ${rollback_code:-000}"
            exit 1
          fi

          rm -f "$ARCHIVE"

          ls -1dt "$ROLLBACK_ROOT"/* 2>/dev/null             | tail -n +4             | while IFS= read -r old_backup; do
                rm -rf -- "$old_backup"
              done

          echo "RENTAUTO revision $SHA is live and verified."
          REMOTE
          } | ssh -T                 -i ~/.ssh/rentauto_deploy_key                 -p "$MOCHAHOST_PORT"                 -o BatchMode=yes                 -o ConnectTimeout=15                 -o ServerAliveInterval=15                 -o ServerAliveCountMax=3                 "$MOCHAHOST_USER@$MOCHAHOST_HOST"                 "bash -se"

      - name: Verify live revision from runner
        shell: bash
        run: |
          set -euo pipefail

          curl             --fail             --silent             --show-error             --max-time 20             "$PRODUCTION_URL/healthz"

          echo

          curl             --fail             --silent             --show-error             --max-time 20             "$PRODUCTION_URL/"             >/dev/null

          live_revision="$(curl             --fail             --silent             --show-error             --max-time 20             "$PRODUCTION_URL/revision.txt"             | tr -d '\r\n')"

          if [ "$live_revision" != "$DEPLOY_SHA" ]; then
            echo "::error::Live revision mismatch: expected $DEPLOY_SHA, got $live_revision"
            exit 1
          fi

          echo "rentauto.ca is live at revision $live_revision"
