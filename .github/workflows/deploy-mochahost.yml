name: Deploy rentauto.ca to MochaHost

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "supabase/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rentauto-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy rentauto.ca
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Browser-safe shared TAKATAK Supabase project. Server secrets remain in Supabase.
      VITE_TAKATAK_SUPABASE_URL: https://pcjfahhlozsseqqevimi.supabase.co
      VITE_TAKATAK_SUPABASE_PUBLISHABLE_KEY: sb_publishable_DKcKo_UMmp1cix9vVTr0fA_TFW4ryk0
      VITE_TAKATAK_SUPABASE_PROJECT_ID: pcjfahhlozsseqqevimi
      VITE_APP_URL: https://rentauto.ca

      MOCHAHOST_HOST: ${{ secrets.MOCHAHOST_HOST }}
      MOCHAHOST_USER: ${{ secrets.MOCHAHOST_USER }}
      MOCHAHOST_PORT: ${{ secrets.MOCHAHOST_PORT || '22' }}
      MOCHAHOST_APP_PATH: ${{ vars.MOCHAHOST_APP_PATH || '/home/bolonca/rentauto_node' }}

      PRODUCTION_URL: https://rentauto.ca

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VITE_TAKATAK_SUPABASE_URL:-}" ]; then
            echo "::error::Missing VITE_TAKATAK_SUPABASE_URL"
            exit 1
          fi

          if [ -z "${VITE_TAKATAK_SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::Missing VITE_TAKATAK_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

          if [ -z "${VITE_TAKATAK_SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::Missing VITE_TAKATAK_SUPABASE_PROJECT_ID"
            exit 1
          fi

          if [ -z "${MOCHAHOST_HOST:-}" ]; then
            echo "::error::Missing GitHub secret MOCHAHOST_HOST"
            exit 1
          fi

          if [ -z "${MOCHAHOST_USER:-}" ]; then
            echo "::error::Missing GitHub secret MOCHAHOST_USER"
            exit 1
          fi

          if [ -z "${MOCHAHOST_PORT:-}" ]; then
            echo "::error::MOCHAHOST_PORT is empty"
            exit 1
          fi

          if [ -z "${MOCHAHOST_APP_PATH:-}" ]; then
            echo "::error::MOCHAHOST_APP_PATH is empty"
            exit 1
          fi

          echo "Configuration values are present."
          echo "Deployment path: $MOCHAHOST_APP_PATH"
          echo "SSH port: $MOCHAHOST_PORT"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production frontend
        run: npm run build

      - name: Verify production build
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html was not created."
            exit 1
          fi

          echo "$GITHUB_SHA" > REVISION

          echo "Production build verified."
          echo "Revision: $GITHUB_SHA"

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .deploy
          mkdir -p .deploy/release

          cp -a dist .deploy/release/dist
          cp REVISION .deploy/release/REVISION

          tar \
            -C .deploy/release \
            -czf ".deploy/rentauto-${GITHUB_SHA}.tar.gz" \
            .

          test -f ".deploy/rentauto-${GITHUB_SHA}.tar.gz"

          echo "Release archive created successfully."

      - name: Configure SSH
        shell: bash
        env:
          MOCHAHOST_SSH_KEY: ${{ secrets.MOCHAHOST_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${MOCHAHOST_SSH_KEY:-}" ]; then
            echo "::error::Missing GitHub secret MOCHAHOST_SSH_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$MOCHAHOST_SSH_KEY" \
            | tr -d '\r' \
            > ~/.ssh/rentauto_deploy_key

          chmod 600 ~/.ssh/rentauto_deploy_key

          echo "Checking private SSH key..."

          if ! ssh-keygen -y \
            -f ~/.ssh/rentauto_deploy_key \
            >/dev/null 2>&1; then

            echo "::error::MOCHAHOST_SSH_KEY is not a valid private SSH key."
            exit 1
          fi

          echo "Private SSH key is valid."

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "Reading MochaHost SSH host key..."

          ssh-keyscan \
            -p "$MOCHAHOST_PORT" \
            -H "$MOCHAHOST_HOST" \
            >> ~/.ssh/known_hosts

          echo "SSH configuration completed."

      - name: Test SSH connection
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing SSH connection to MochaHost..."

          printf '%s\n' \
            "echo 'SSH connection successful'" \
            "whoami" \
            "exit" \
            | ssh -tt \
                -i ~/.ssh/rentauto_deploy_key \
                -p "$MOCHAHOST_PORT" \
                -o BatchMode=yes \
                -o ConnectTimeout=15 \
                "$MOCHAHOST_USER@$MOCHAHOST_HOST"

      - name: Upload release archive
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing remote deployment folders..."

          printf '%s\n' \
            "mkdir -p '$MOCHAHOST_APP_PATH/incoming' '$MOCHAHOST_APP_PATH/releases' '$MOCHAHOST_APP_PATH/tmp'" \
            "exit" \
            | ssh -tt \
                -i ~/.ssh/rentauto_deploy_key \
                -p "$MOCHAHOST_PORT" \
                -o BatchMode=yes \
                "$MOCHAHOST_USER@$MOCHAHOST_HOST"

          echo "Uploading Rentauto release..."

          scp \
            -i ~/.ssh/rentauto_deploy_key \
            -P "$MOCHAHOST_PORT" \
            -o BatchMode=yes \
            ".deploy/rentauto-${GITHUB_SHA}.tar.gz" \
            "$MOCHAHOST_USER@$MOCHAHOST_HOST:$MOCHAHOST_APP_PATH/incoming/"

          echo "Release uploaded successfully."

      - name: Inspect remote Passenger runtime
        shell: bash
        run: |
          set -euo pipefail

          {
            printf 'set -euo pipefail\n'
            printf 'APP_PATH=%q\n' "$MOCHAHOST_APP_PATH"
            printf 'PRODUCTION_URL=%q\n' "$PRODUCTION_URL"
            cat <<'REMOTE'
          cd "$APP_PATH"

          echo "=== RENTAUTO SAFE RUNTIME DIAGNOSTICS ==="
          echo "Current revision:"
          if [ -f CURRENT ]; then cat CURRENT; else echo "(missing CURRENT)"; fi

          echo "Previous revision:"
          if [ -f PREVIOUS ]; then cat PREVIOUS; else echo "(missing PREVIOUS)"; fi

          echo "Application root entries:"
          find . -maxdepth 1 -mindepth 1             ! -name '.env'             ! -name '.env.*'             -printf '%f\n'             | sort

          echo "Candidate Passenger entrypoints:"
          for candidate in app.js server.cjs server.js index.js; do
            if [ -f "$candidate" ]; then
              echo "--- $candidate ---"
              stat -c 'size=%s modified=%y' "$candidate" || true
              node --check "$candidate" || true
              grep -nE 'CURRENT|PREVIOUS|healthz|releases|REVISION|express|listen|process\.env|dist' "$candidate"                 | head -n 120                 || true
            fi
          done

          echo "Current release structure:"
          if [ -f CURRENT ]; then
            current="$(tr -d '\r\n' < CURRENT)"
            if [ -n "$current" ] && [ -d "releases/$current" ]; then
              find "releases/$current" -maxdepth 2 -type f                 -printf '%p %s bytes\n'                 | sort                 | head -n 80
              test -f "releases/$current/dist/index.html"                 && sha256sum "releases/$current/dist/index.html"                 || true
            fi
          fi

          echo "Known runtime log files (names only):"
          find . -maxdepth 3 -type f             \( -name 'stderr.log' -o -name 'error.log' -o -name 'passenger.log' -o -name '*.stderr.log' \)             -printf '%p %s bytes\n'             2>/dev/null             | head -n 40             || true

          echo "Current public health response:"
          curl             --silent             --show-error             --include             --max-time 15             "$PRODUCTION_URL/healthz"             | head -n 40             || true

          echo "Attempting one clean Passenger restart of current revision..."
          mkdir -p tmp
          touch tmp/restart.txt

          recovered=0
          for attempt in 1 2 3 4 5 6; do
            sleep 3
            if curl               --fail               --silent               --show-error               --max-time 15               "$PRODUCTION_URL/healthz"               >/dev/null; then
              recovered=1
              echo "Current revision recovered on attempt $attempt."
              break
            fi
          done

          if [ "$recovered" -ne 1 ]; then
            echo "Current revision is still unhealthy before release switch."
            echo "Matching runtime error lines:"
            for log in stderr.log error.log logs/error.log tmp/stderr.log; do
              if [ -f "$log" ]; then
                echo "--- $log ---"
                grep -E 'Error|ERR_|Cannot find|SyntaxError|ReferenceError|TypeError|MODULE_NOT_FOUND|ENOENT|Passenger' "$log"                   | tail -n 80                   | sed -E 's/([A-Za-z_]*(TOKEN|KEY|SECRET|PASSWORD)[A-Za-z_]*)=[^ ]+/\1=[REDACTED]/Ig'                   || true
              fi
            done
          fi

          exit
          REMOTE
          } | ssh -tt                 -i ~/.ssh/rentauto_deploy_key                 -p "$MOCHAHOST_PORT"                 -o BatchMode=yes                 "$MOCHAHOST_USER@$MOCHAHOST_HOST"

      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail

          {
            printf 'set -euo pipefail\n'
            printf 'APP_PATH=%q\n' "$MOCHAHOST_APP_PATH"
            printf 'SHA=%q\n' "$GITHUB_SHA"
            printf 'PRODUCTION_URL=%q\n' "$PRODUCTION_URL"
            cat <<'REMOTE'
          cd "$APP_PATH"

          ARCHIVE="incoming/rentauto-${SHA}.tar.gz"
          RELEASE_DIR="releases/${SHA}"

          echo "Application path: $APP_PATH"
          echo "Deploying revision: $SHA"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Release archive does not exist: $ARCHIVE"
            exit 1
          fi

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

          if [ ! -f "$RELEASE_DIR/dist/index.html" ]; then
            echo "ERROR: dist/index.html is missing from new release."
            exit 1
          fi

          OLD=""

          if [ -f CURRENT ]; then
            OLD="$(tr -d '\r\n' < CURRENT)"
          fi

          echo "Previous revision: ${OLD:-none}"

          if [ -n "$OLD" ]; then
            printf '%s\n' "$OLD" > PREVIOUS.new
            mv PREVIOUS.new PREVIOUS
          fi

          printf '%s\n' "$SHA" > CURRENT.new
          mv CURRENT.new CURRENT

          mkdir -p tmp

          echo "Restarting Passenger..."
          touch tmp/restart.txt

          echo "Waiting for application health check..."

          ok=0

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Health check attempt $attempt..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              "$PRODUCTION_URL/healthz" \
              >/dev/null; then

              ok=1
              break
            fi

            sleep 3
          done

          if [ "$ok" -ne 1 ]; then
            echo "ERROR: Health check failed for revision $SHA."
            echo "=== FAILED RELEASE DIAGNOSTICS ==="
            echo "CURRENT=$(tr -d '\\r\\n' < CURRENT 2>/dev/null || true)"
            echo "PREVIOUS=$(tr -d '\\r\\n' < PREVIOUS 2>/dev/null || true)"
            find "$RELEASE_DIR" -maxdepth 2 -type f               -printf '%p %s bytes\\n'               | sort               | head -n 80               || true
            test -f "$RELEASE_DIR/dist/index.html"               && sha256sum "$RELEASE_DIR/dist/index.html"               || true

            echo "HTTP health response while failed:"
            curl               --silent               --show-error               --include               --max-time 15               "$PRODUCTION_URL/healthz"               | head -n 40               || true

            echo "Matching runtime error lines:"
            for log in stderr.log error.log logs/error.log tmp/stderr.log; do
              if [ -f "$log" ]; then
                echo "--- $log ---"
                grep -E 'Error|ERR_|Cannot find|SyntaxError|ReferenceError|TypeError|MODULE_NOT_FOUND|ENOENT|Passenger' "$log"                   | tail -n 80                   | sed -E 's/([A-Za-z_]*(TOKEN|KEY|SECRET|PASSWORD)[A-Za-z_]*)=[^ ]+/\\1=[REDACTED]/Ig'                   || true
              fi
            done

            echo "Starting automatic rollback."

            if [ -n "$OLD" ] && [ -d "releases/$OLD" ]; then
              printf '%s\n' "$OLD" > CURRENT.new
              mv CURRENT.new CURRENT

              touch tmp/restart.txt
              sleep 5

              echo "Rolled back to revision: $OLD"

              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 15 \
                "$PRODUCTION_URL/healthz" \
                >/dev/null || true
            else
              echo "No previous release was available for rollback."
            fi

            exit 1
          fi

          echo "Health check successful."
          echo "Revision $SHA is now live."

          rm -f "$ARCHIVE"

          ls -1dt releases/* 2>/dev/null \
            | tail -n +6 \
            | xargs -r rm -rf

          echo "Deployment completed successfully."
          exit
          REMOTE
          } | ssh -tt \
                -i ~/.ssh/rentauto_deploy_key \
                -p "$MOCHAHOST_PORT" \
                -o BatchMode=yes \
                "$MOCHAHOST_USER@$MOCHAHOST_HOST"

      - name: Verify live website
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking live Rentauto website..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            "$PRODUCTION_URL/healthz"

          echo
          echo "rentauto.ca deployment completed successfully."
